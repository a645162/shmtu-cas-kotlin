plugins {
    id 'org.jetbrains.kotlin.jvm'
    id 'application'
}

application {
    mainClass.set('cn.edu.shmtu.cas.cli.MainKt')
}

run {
    standardInput = System.in
}

dependencies {
    implementation project(':cas_lib')
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2'
}

kotlin {
    jvmToolchain(21)
}
