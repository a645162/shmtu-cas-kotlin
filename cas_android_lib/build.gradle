plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'maven-publish'
}

android {
    namespace = 'cn.edu.shmtu.cas'
    compileSdk = 37

    defaultConfig {
        minSdk = 21
        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

kotlin {
    jvmToolchain(17)
}

dependencies {
    // api: 让 cas_lib 的所有公开 API 传递给 cas_android_lib 的消费者(app / ocr_app_demo)
    // 这样 app 只需 implementation("cn.edu.shmtu.cas:shmtu-cas-android:...") 即可同时获得 cas_lib 的类
    api project(':cas_lib')

    implementation 'org.jsoup:jsoup:1.22.2'
    implementation 'com.squareup.okhttp3:okhttp:5.3.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = project.group
                artifactId = 'shmtu-cas-android'
                version = project.version

                pom {
                    name = 'SHMTU CAS Android Library'
                    description = 'Android AAR for SHMTU CAS login and bill querying.'
                }
            }
        }
    }
}
